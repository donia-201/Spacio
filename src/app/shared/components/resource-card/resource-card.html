<div
class="bg-white rounded-xl shadow p-5">

<img
[src]="
    resource.type === 'Clinic' 
    ? 'https://images.unsplash.com/photo-1584515901367-f1c2a12247cd?q=80&w=600&auto=format&fit=crop' 
    : 'https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?q=80&w=600&auto=format&fit=crop'
  "
  class="rounded-lg h-48 w-full object-cover"
  alt="Resource Image">

<h2
class="text-xl font-bold mt-4">
{{resource.name}}
</h2>

<p class="text-gray-500">
{{resource.description}}
</p>

<p class="mt-2">
📍 {{resource.address}}
</p>

<p class="mt-2">
🏢 {{resource.type}}
</p>

<span
class="px-3 py-1 rounded-full text-sm"

[ngClass]="{
'bg-green-100 text-green-600':
resource.status==='available',

'bg-red-100 text-red-600':
resource.status==='booked',

'bg-yellow-100 text-yellow-600':
resource.status==='maintenance'
}"
>
{{resource.status | status}}
</span>

<button
(click)="bookNow()"
class="bg-blue-600 text-white w-full mt-4 py-2 rounded-lg">

Book Now

</button>

</div>
