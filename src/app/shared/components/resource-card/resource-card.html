<article class="group bg-white rounded-2xl border border-slate-200 overflow-hidden hover:shadow-lg hover:-translate-y-0.5 transition-all">
  <div class="relative h-48 bg-slate-100 overflow-hidden">
    <img [src]="resource.image || (resource.type?.toLowerCase().includes('workspace') ? 'https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=800&auto=format&fit=crop' : 'https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?w=800&auto=format&fit=crop')" [alt]="resource.name" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
    <div class="absolute inset-x-0 bottom-0 h-20 bg-gradient-to-t from-black/50 to-transparent"></div>
    <span class="absolute top-3 left-3 px-2.5 py-1 rounded-full bg-white/90 backdrop-blur text-[11px] font-semibold text-slate-700">{{ resource.type }}</span>
    <span class="absolute bottom-3 right-3 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-white/90" [ngClass]="{'text-emerald-600': resource.status==='available','text-red-600': resource.status==='booked','text-amber-600': resource.status==='maintenance'}">{{ resource.status | status }}</span>
  </div>
  <div class="p-5">
    <h2 class="font-bold text-slate-900 line-clamp-1">{{ resource.name }}</h2>
    <p class="text-xs text-slate-500 mt-1 line-clamp-2 min-h-8">{{ resource.description }}</p>
    <div class="flex items-center gap-1.5 text-xs text-slate-500 mt-3"><span>⌖</span><span class="truncate">{{ resource.address }}{{ resource.governorate ? ', ' + resource.governorate : '' }}</span></div>
    @if (resource.organization?.name) { <div class="text-xs text-slate-400 mt-2 truncate">{{ resource.organization?.name }}</div> }
    <button (click)="bookNow()" [disabled]="resource.status !== 'available'" class="w-full mt-4 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed transition-colors">{{ resource.status === 'available' ? 'Book Now' : 'Unavailable' }}</button>
  </div>
</article>
